[package]
description = "Captures minidumps in a child process"
edition = "2021"
license = "MIT OR Apache-2.0"
name = "minidumper-child"
readme = "README.md"
repository = "https://github.com/timfish/minidumper-child"
version = "0.5.1"

[dependencies]
crash-handler = "0.7"
minidumper = "0.10"
thiserror = "2"
uuid = {version = "1", features = ["v4"]}

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
sadness-generator = "0.7"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
